# nginx.conf - serve the built app; /api/* goes to FastAPI with the /api prefix removed (same as the Vite dev proxy).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 30m;   # uploads (the API enforces its own limit)

    location /api/ {
        proxy_pass http://wealthos-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # AI answers and report builds can take a while
    }
    location / {
        try_files $uri /index.html;
    }
}
