# docker-compose.yml - the web app, the API, the price worker and Postgres (sign-in + LLM cost log).
# User data lives in ./backend/storage (mounted into the API and the worker).
# Start: docker compose up -d --build   ·   App: http://localhost:8080   ·   API docs: http://localhost:8000/docs
services:
  wealthos-api:
    build:
      context: ./backend
    image: wealthos-api:latest
    container_name: wealthos-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WEALTHOS_DB_URL: postgresql://wealthos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@wealthos-db:5432/wealthos
      WEALTHOS_ENV: production
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      wealthos-db:
        condition: service_healthy
    restart: unless-stopped

  wealthos-worker:   # refreshes NSE / mutual fund prices each evening (app/worker.py); reuses the API's image
    image: wealthos-api:latest
    pull_policy: never
    container_name: wealthos-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      WEALTHOS_DB_URL: postgresql://wealthos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@wealthos-db:5432/wealthos
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - wealthos-api
    restart: unless-stopped

  wealthos-web:      # the React app on nginx; /api/* is forwarded to wealthos-api
    build:
      context: ./frontend
    container_name: wealthos-web
    ports:
      - "8080:80"
    depends_on:
      - wealthos-api
    restart: unless-stopped

  wealthos-db:
    image: postgres:16-alpine
    container_name: wealthos-db
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: local dev reaches it, the network does not
    environment:
      POSTGRES_USER: wealthos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wealthos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
