# Golden question set for filing Q&A over two real 10-K filings.
# pages: 1-based PDF pages that answer the question (every such page). facts: short strings copied from the page
# text, with PDF ligatures expanded (fi, fl, ff) and non-breaking spaces written as plain spaces.
# Unanswerable items: answerable false, pages [], answer "not found in the filings".
# cross_company items: file lists both filings and pages are written as "file:page".

# ── Apple, fiscal 2025 (aapl_10k_2025.pdf, 97 pages) ──
- {id: a01, q: "What risks does Apple see from the new U.S. tariffs and trade restrictions?", file: aapl_10k_2025.pdf, pages: [10, 30], answer: "New U.S. tariffs announced beginning in the second quarter of 2025, plus retaliatory measures, can raise costs, limit the availability of components, rare earths and raw materials, force supply-chain changes and hurt pricing and gross margin.", facts: ["Beginning in the second quarter of 2025", "rare earths", "Section 232"], answerable: true, kind: risk}
- {id: a02, q: "How is Apple's business split into reportable segments?", file: aapl_10k_2025.pdf, pages: [5, 30, 71], answer: "Apple manages its business primarily on a geographic basis, with reportable segments Americas, Europe, Greater China, Japan and Rest of Asia Pacific.", facts: ["geographic basis", "Americas, Europe, Greater China, Japan and Rest of Asia Pacific"], answerable: true, kind: fact}
- {id: a03, q: "What is the Epic Games lawsuit against Apple about?", file: aapl_10k_2025.pdf, pages: [25], answer: "Epic Games alleged antitrust and unfair competition violations in Apple's App Store; the court issued the 2021 Injunction on steering to other purchasing mechanisms, and on April 30, 2025 found Apple in violation of it, which Apple has appealed to the Ninth Circuit.", facts: ["2021 Injunction", "April 30, 2025", "Ninth Circuit"], answerable: true, kind: legal}
- {id: a04, q: "What is the European Commission investigating Apple for under the Digital Markets Act?", file: aapl_10k_2025.pdf, pages: [25], answer: "The Article 5(4) investigation covers how developers can steer users to offers outside the App Store (Apple was fined €500 million and appealed); the Article 6(4) investigation covers Apple's contractual requirements for developers and app marketplaces.", facts: ["Article 5(4)", "€500 million", "Article 6(4)"], answerable: true, kind: legal}
- {id: a05, q: "What does the Department of Justice antitrust lawsuit against Apple claim?", file: aapl_10k_2025.pdf, pages: [25], answer: "Filed March 21, 2024, the DOJ and state attorneys general allege monopolization or attempted monopolization of the markets for performance smartphones and smartphones in violation of U.S. antitrust laws.", facts: ["March 21, 2024", "monopolization", "performance smartphones"], answerable: true, kind: legal}
- {id: a06, q: "Where is Apple's manufacturing done and by whom?", file: aapl_10k_2025.pdf, pages: [10, 12, 70], answer: "Most manufacturing is done by outsourcing partners located primarily in China mainland, India, Japan, South Korea, Taiwan and Vietnam.", facts: ["outsourcing partners", "China mainland, India, Japan, South Korea, Taiwan and Vietnam"], answerable: true, kind: fact}
- {id: a07, q: "How many people does Apple employ?", file: aapl_10k_2025.pdf, pages: [8], answer: "As of September 27, 2025, Apple had approximately 166,000 full-time equivalent employees.", facts: ["166,000", "full-time equivalent employees"], answerable: true, kind: numeric}
- {id: a08, q: "Who at Apple is in charge of managing cybersecurity threats?", file: aapl_10k_2025.pdf, pages: [24], answer: "Management, led by the Head of Corporate Information Security, is responsible for cybersecurity risk, with the Audit and Finance Committee of the Board overseeing it.", facts: ["Head of Corporate Information Security", "Audit Committee"], answerable: true, kind: fact}
- {id: a09, q: "Why did Apple's products gross margin percentage change in 2025?", file: aapl_10k_2025.pdf, pages: [32], answer: "Products gross margin percentage fell to 36.8% from 37.2%, mainly due to a different mix of products and tariff costs, partly offset by other favorable costs.", facts: ["36.8%", "different mix of products and tariff costs"], answerable: true, kind: fact}
- {id: a10, q: "How much stock did Apple buy back and what is its capital return program?", file: aapl_10k_2025.pdf, pages: [26, 36, 67], answer: "In 2025 Apple repurchased 402 million shares for $89.3 billion; in May 2025 it announced a new repurchase program of up to $100 billion and raised its quarterly dividend to $0.26 per share.", facts: ["$89.3 billion", "402 million shares", "$100 billion"], answerable: true, kind: numeric}
- {id: a11, q: "How could the Google search antitrust ruling hurt Apple's revenue?", file: aapl_10k_2025.pdf, pages: [20], answer: "Apple earns licensing revenue from Google for search; if the court's September 2, 2025 remedies order is reversed on appeal, remedies prohibiting Google from offering Apple commercial terms for search distribution could hurt that revenue.", facts: ["licensing arrangements with Google", "September 2, 2025", "search distribution"], answerable: true, kind: risk}
- {id: a12, q: "What was the European Commission State Aid decision about Apple's Irish taxes?", file: aapl_10k_2025.pdf, pages: [58], answer: "The Commission ruled in 2016 that Ireland gave Apple state aid through tax opinions; the ECJ confirmed it on September 10, 2024, and Apple recorded a one-time net tax charge of $10.2 billion, including $15.8 billion payable to Ireland.", facts: ["September 10, 2024", "$10.2 billion", "$15.8 billion"], answerable: true, kind: notes}
- {id: a13, q: "How does Apple describe the competition it faces?", file: aapl_10k_2025.pdf, pages: [5, 6, 11], answer: "Apple's markets are highly competitive, with aggressive price competition, downward pressure on gross margins and short product life cycles; competitors imitate its products and Apple has a minority market share in smartphones, PCs, tablets and wearables.", facts: ["aggressive price competition", "minority market share"], answerable: true, kind: fact}
- {id: a14, q: "What services does Apple sell, such as AppleCare, cloud and payments?", file: aapl_10k_2025.pdf, pages: [5], answer: "Apple's services include advertising, AppleCare, cloud services, digital content such as the App Store and subscriptions, and payment services such as Apple Card and Apple Pay.", facts: ["AppleCare", "Apple Card", "Apple Pay"], answerable: true, kind: fact}
- {id: a15, q: "Where is Apple headquartered and what facilities does it have?", file: aapl_10k_2025.pdf, pages: [1, 24], answer: "Apple is headquartered in Cupertino, California, and owns or leases facilities and land for corporate functions, R&D, data centers, retail and other purposes in the U.S. and abroad.", facts: ["Cupertino, California", "data centers, retail"], answerable: true, kind: fact}
- {id: a16, q: "What was Apple's total gross unrecognized tax benefits balance at the end of fiscal 2025?", file: aapl_10k_2025.pdf, pages: [62, 74], answer: "As of September 27, 2025, gross unrecognized tax benefits were $23.2 billion, of which $10.6 billion would affect the effective tax rate if recognized.", facts: ["$23.2 billion", "$10.6 billion"], answerable: true, kind: notes}
- {id: a17, q: "How much commercial paper did Apple have outstanding at the end of fiscal 2025?", file: aapl_10k_2025.pdf, pages: [34, 64], answer: "Apple had $8.0 billion of commercial paper outstanding as of September 27, 2025, with a weighted-average interest rate of 4.19%.", facts: ["$8.0 billion", "4.19%"], answerable: true, kind: notes}
- {id: a18, q: "What is the weighted-average remaining lease term and discount rate on Apple's lease liabilities?", file: aapl_10k_2025.pdf, pages: [64], answer: "As of September 27, 2025, the weighted-average remaining lease term was 9.8 years and the discount rate was 3.4%.", facts: ["9.8 years", "3.4%"], answerable: true, kind: notes}
- {id: a19, q: "How does Apple allocate revenue between iPhone hardware and bundled services like iCloud?", file: aapl_10k_2025.pdf, pages: [51], answer: "Apple allocates revenue by relative stand-alone selling prices between the hardware and bundled software, recognized when shipped, and product-related bundled services such as iCloud, Siri and Maps, which are deferred and recognized straight-line over the service period.", facts: ["iCloud", "straight-line basis", "stand-alone selling prices"], answerable: true, kind: notes}
- {id: a20, q: "How much deferred revenue did Apple have at the end of fiscal 2025?", file: aapl_10k_2025.pdf, pages: [52], answer: "Apple had total deferred revenue of $13.7 billion as of September 27, 2025, and expects 66% of it to be realized in less than a year.", facts: ["$13.7 billion", "66%"], answerable: true, kind: notes}
- {id: a21, q: "What are Apple's total future unconditional purchase obligations?", file: aapl_10k_2025.pdf, pages: [70], answer: "Future payments under unconditional purchase obligations with terms over one year total $13,308 million as of September 27, 2025.", facts: ["13,308"], answerable: true, kind: notes}
- {id: a22, q: "How do RSUs vest under Apple's 2022 Employee Stock Plan?", file: aapl_10k_2025.pdf, pages: [68], answer: "RSUs under the 2022 Plan generally vest over four years based on continued employment and settle in shares one-for-one; about 1.3 billion shares were authorized.", facts: ["vest over four years", "1.3 billion shares"], answerable: true, kind: notes}
- {id: a23, q: "What was the fair value of Apple's term debt notes at the end of fiscal 2025?", file: aapl_10k_2025.pdf, pages: [67], answer: "The fair value of Apple's Notes was $80.4 billion as of September 27, 2025, against total term debt principal of $91,281 million.", facts: ["$80.4 billion", "91,281"], answerable: true, kind: notes}
- {id: a24, q: "How many shareholders of record does Apple have?", file: aapl_10k_2025.pdf, pages: [26], answer: "As of October 17, 2025, Apple had 22,429 shareholders of record.", facts: ["22,429"], answerable: true, kind: numeric}
- {id: a25, q: "What share of Apple's net sales went through direct versus indirect channels in 2025?", file: aapl_10k_2025.pdf, pages: [5], answer: "In 2025, direct and indirect distribution channels accounted for 40% and 60% of total net sales, respectively.", facts: ["40% and 60%"], answerable: true, kind: numeric}
- {id: a26, q: "What was Apple's effective tax rate for fiscal 2025?", file: aapl_10k_2025.pdf, pages: [34, 60], answer: "Apple's effective tax rate was 15.6% in 2025, compared with 24.1% in 2024.", facts: ["15.6%", "24.1%"], answerable: true, kind: numeric}
- {id: a27, q: "How much were Apple's iPhone net sales in 2025?", file: aapl_10k_2025.pdf, pages: [31, 52], answer: "iPhone net sales were $209,586 million in 2025, up 4% from $201,183 million in 2024.", facts: ["209,586", "201,183"], answerable: true, kind: numeric}
- {id: a28, q: "How much did Apple spend on research and development in 2025?", file: aapl_10k_2025.pdf, pages: [32, 40, 71], answer: "Apple's research and development expense was $34,550 million in 2025, up 10% from 2024.", facts: ["34,550"], answerable: true, kind: numeric}
- {id: a29, q: "What is Apple's quarterly dividend per share?", file: aapl_10k_2025.pdf, pages: [36], answer: "As of September 27, 2025, Apple's quarterly cash dividend was $0.26 per share, raised from $0.25 in May 2025.", facts: ["$0.26 per share", "$0.25"], answerable: true, kind: numeric}
- {id: a30, q: "Which quarter usually has Apple's highest net sales and why?", file: aapl_10k_2025.pdf, pages: [8], answer: "Apple has historically had higher net sales in its first fiscal quarter, due in part to seasonal holiday demand.", facts: ["first quarter", "seasonal holiday demand"], answerable: true, kind: fact}
- {id: a31, q: "What is Apple Vision Pro?", file: aapl_10k_2025.pdf, pages: [4], answer: "Apple Vision Pro is Apple's spatial computer based on its visionOS operating system.", facts: ["spatial computer", "visionOS"], answerable: true, kind: fact}

# ── NVIDIA, fiscal 2026 (nvda_10k_2026.pdf, 129 pages) ──
- {id: n01, q: "What are NVIDIA's operating segments?", file: nvda_10k_2026.pdf, pages: [6, 50, 55, 115], answer: "NVIDIA has two operating segments: Compute & Networking (Data Center platforms and Automotive) and Graphics (GeForce GPUs and RTX workstation graphics).", facts: ["Compute & Networking", "Graphics"], answerable: true, kind: fact}
- {id: n02, q: "How did U.S. export rules on the H20 chip affect NVIDIA?", file: nvda_10k_2026.pdf, pages: [14, 39, 50, 51, 55, 57], answer: "After the USG required a license for H20 exports to China in April 2025, NVIDIA took a $4.5 billion charge in Q1 fiscal 2026 for excess inventory and purchase obligations; later licenses produced only about $60 million of H20 revenue.", facts: ["$4.5 billion charge", "approximately $60 million in H20 revenue", "April 2025"], answerable: true, kind: numeric}
- {id: n03, q: "Which foundries make NVIDIA's semiconductor wafers?", file: nvda_10k_2026.pdf, pages: [11], answer: "NVIDIA uses foundries such as Taiwan Semiconductor Manufacturing Company (TSMC) and Samsung Electronics to produce its wafers.", facts: ["TSMC", "Samsung"], answerable: true, kind: fact}
- {id: n04, q: "How concentrated is NVIDIA's revenue among its direct customers?", file: nvda_10k_2026.pdf, pages: [34, 57, 117], answer: "In fiscal 2026, one direct customer represented 22% of total revenue and another 14%, both mainly in the Compute & Networking segment.", facts: ["22% of total revenue", "14% of total revenue"], answerable: true, kind: numeric}
- {id: n05, q: "What securities class action lawsuit is NVIDIA defending?", file: nvda_10k_2026.pdf, pages: [44, 105], answer: "NVIDIA is defending In Re NVIDIA Corporation Securities Litigation, a shareholder class action alleging false or misleading statements about channel inventory and the impact of cryptocurrency mining on GPU demand in 2017 and 2018.", facts: ["channel inventory", "cryptocurrency mining", "4:18-cv-07669-HSG"], answerable: true, kind: legal}
- {id: n06, q: "How many employees does NVIDIA have and in how many countries?", file: nvda_10k_2026.pdf, pages: [15], answer: "At the end of fiscal 2026 NVIDIA had approximately 42,000 employees in 38 countries.", facts: ["42,000 employees in 38 countries"], answerable: true, kind: numeric}
- {id: n07, q: "How does NVIDIA's board oversee cybersecurity risk?", file: nvda_10k_2026.pdf, pages: [46], answer: "Information security is overseen by the Board, with the Audit Committee reviewing security policies and controls and receiving regular updates from the Chief Security Officer.", facts: ["Audit Committee", "Chief Security Officer"], answerable: true, kind: fact}
- {id: n08, q: "What drove NVIDIA's Data Center revenue growth in fiscal 2026?", file: nvda_10k_2026.pdf, pages: [50, 51, 55], answer: "Data Center revenue rose 68%, driven by accelerated computing and AI; Data Center computing grew 59% on Blackwell demand and networking grew 142% on NVLink compute fabric for GB200 and GB300 systems.", facts: ["up 68%", "Blackwell", "142%"], answerable: true, kind: fact}
- {id: n09, q: "How does NVIDIA decide on inventory provisions?", file: nvda_10k_2026.pdf, pages: [53, 73, 87], answer: "NVIDIA writes inventory down to the lower of cost or net realizable value or for excess or obsolete inventory and excess purchase commitments, based on inventory levels and commitments compared with assumptions about future demand and market conditions.", facts: ["lower of cost or net realizable value", "excess quantities of products"], answerable: true, kind: notes}
- {id: n10, q: "What is CUDA and how does NVIDIA use it in its platform strategy?", file: nvda_10k_2026.pdf, pages: [5, 8, 10], answer: "CUDA, introduced in 2006, is NVIDIA's development platform that runs on all NVIDIA GPUs and underpins its full-stack platform with CUDA-X libraries; over 7.5 million developers use CUDA and NVIDIA software tools.", facts: ["CUDA in 2006", "CUDA-X", "7.5 million developers"], answerable: true, kind: fact}
- {id: n11, q: "How much stock did NVIDIA repurchase and how much authorization is left?", file: nvda_10k_2026.pdf, pages: [47, 48, 61, 113], answer: "In fiscal 2026 NVIDIA repurchased 282 million shares for $40.4 billion, and as of January 25, 2026 it could repurchase up to $58.5 billion more.", facts: ["$40.4 billion", "282 million shares", "$58.5 billion"], answerable: true, kind: numeric}
- {id: n12, q: "Where is NVIDIA headquartered and what properties does it use?", file: nvda_10k_2026.pdf, pages: [1, 6, 47, 50, 83], answer: "NVIDIA is headquartered in Santa Clara, California, where it owns and leases about 3 million square feet, and it owns and leases data center, R&D and sales facilities in the U.S. and abroad, mainly China, India, Israel and Taiwan.", facts: ["Santa Clara, California", "3 million square feet"], answerable: true, kind: fact}
- {id: n13, q: "How could climate change affect NVIDIA's business?", file: nvda_10k_2026.pdf, pages: [32, 33], answer: "Climate change can threaten water and energy availability, cause wildfire-related power shut-offs at its Santa Clara offices, disrupt supply chains, and bring stakeholder, legal and reputational pressure including concerns about GPU energy use.", facts: ["Water and energy availability", "power safety shut offs", "energy requirements of our GPUs"], answerable: true, kind: risk}
- {id: n14, q: "What would the AI Diffusion rule have meant for NVIDIA?", file: nvda_10k_2026.pdf, pages: [14, 40], answer: "The AI Diffusion IFR would have imposed a worldwide licensing requirement on data center products like H200, GB200 and GB300 and split the world into three tiers; the USG said in May 2025 it would rescind it.", facts: ["worldwide licensing requirement", "three tiers", "rescind"], answerable: true, kind: legal}
- {id: n15, q: "How has the Chinese government's stance hurt NVIDIA's data center sales in China?", file: nvda_10k_2026.pdf, pages: [14, 15, 40, 41], answer: "The Chinese government has encouraged customers to buy from China-based competitors and discouraged buying NVIDIA data center products; with no product approved by both governments, NVIDIA was effectively foreclosed from China's data center compute market.", facts: ["effectively foreclosed", "China-based competitors"], answerable: true, kind: risk}
- {id: n16, q: "What did NVIDIA record for its license agreement with Groq?", file: nvda_10k_2026.pdf, pages: [90], answer: "NVIDIA recorded $14.4 billion of goodwill and a $2.5 billion developed technology intangible asset; consideration was $13.0 billion paid at closing plus $4 billion payable within one year.", facts: ["$14.4 billion of goodwill", "$2.5 billion", "$13.0 billion"], answerable: true, kind: notes}
- {id: n17, q: "What was NVIDIA's total goodwill at the end of fiscal 2026?", file: nvda_10k_2026.pdf, pages: [92], answer: "Total goodwill was $20.8 billion as of January 25, 2026, of which $20.5 billion was in Compute & Networking and $370 million in Graphics.", facts: ["$20.8 billion", "$20.5 billion"], answerable: true, kind: notes}
- {id: n18, q: "How much unearned stock-based compensation does NVIDIA have left to recognize?", file: nvda_10k_2026.pdf, pages: [90], answer: "As of January 25, 2026, unearned stock-based compensation was $14.8 billion, to be recognized over a weighted average of 2.3 years for RSUs and PSUs and 0.9 years for ESPP.", facts: ["$14.8 billion", "2.3 years"], answerable: true, kind: notes}
- {id: n19, q: "What is the size of NVIDIA's commercial paper program?", file: nvda_10k_2026.pdf, pages: [63, 103], answer: "In January 2026 NVIDIA increased its commercial paper program to $25.0 billion; no commercial paper was outstanding as of January 25, 2026.", facts: ["$25.0 billion", "no commercial paper was outstanding"], answerable: true, kind: notes}
- {id: n20, q: "How large are NVIDIA's manufacturing, supply and capacity commitments?", file: nvda_10k_2026.pdf, pages: [73, 103], answer: "As of January 25, 2026, NVIDIA's manufacturing, supply and capacity commitments were $95.2 billion, substantially all to be paid through fiscal 2027.", facts: ["$95.2 billion"], answerable: true, kind: notes}
- {id: n21, q: "How much does NVIDIA owe under multi-year cloud service agreements?", file: nvda_10k_2026.pdf, pages: [103], answer: "Multi-year cloud service agreement commitments were $27 billion as of January 25, 2026, used mainly to support research and development.", facts: ["$27 billion"], answerable: true, kind: notes}
- {id: n22, q: "What was NVIDIA's retirement plan contribution expense in fiscal 2026?", file: nvda_10k_2026.pdf, pages: [113], answer: "NVIDIA's contribution expense for its defined contribution plans was $442 million in fiscal 2026.", facts: ["$442 million"], answerable: true, kind: notes}
- {id: n23, q: "How much in future lease obligations does NVIDIA expect from leases not yet commenced?", file: nvda_10k_2026.pdf, pages: [118], answer: "NVIDIA expects to commence leases with future obligations of $22.7 billion between fiscal 2027 and 2030, mainly data center leases.", facts: ["$22.7 billion"], answerable: true, kind: notes}
- {id: n24, q: "How much NVIDIA revenue came from China including Hong Kong in fiscal 2026?", file: nvda_10k_2026.pdf, pages: [116], answer: "Revenue from China (including Hong Kong), based on customer headquarters, was $19,677 million in fiscal 2026, down from $25,048 million in fiscal 2025.", facts: ["19,677", "25,048"], answerable: true, kind: notes}
- {id: n25, q: "What was NVIDIA's total revenue for fiscal year 2026?", file: nvda_10k_2026.pdf, pages: [51, 55, 74, 115, 116, 118], answer: "NVIDIA's fiscal 2026 revenue was $215.9 billion ($215,938 million), up 65% from a year ago.", facts: ["$215.9 billion", "215,938", "65%"], answerable: true, kind: numeric}
- {id: n26, q: "What was NVIDIA's gross margin in fiscal 2026?", file: nvda_10k_2026.pdf, pages: [51, 55, 57], answer: "NVIDIA's gross margin was 71.1% in fiscal 2026, down from 75.0% in fiscal 2025.", facts: ["71.1", "75.0"], answerable: true, kind: numeric}
- {id: n27, q: "What was NVIDIA's employee turnover rate in fiscal 2026?", file: nvda_10k_2026.pdf, pages: [15], answer: "NVIDIA's turnover rate was 3.7 percent in fiscal 2026.", facts: ["3.7 percent"], answerable: true, kind: numeric}
- {id: n28, q: "How many registered shareholders does NVIDIA have?", file: nvda_10k_2026.pdf, pages: [47], answer: "As of February 20, 2026, NVIDIA had approximately 1,226 registered shareholders, not counting shares held in street name.", facts: ["1,226 registered shareholders"], answerable: true, kind: numeric}
- {id: n29, q: "How much did NVIDIA pay in cash dividends in fiscal 2026?", file: nvda_10k_2026.pdf, pages: [47, 61, 113], answer: "NVIDIA paid cash dividends of $974 million in fiscal 2026.", facts: ["$974 million"], answerable: true, kind: numeric}
- {id: n30, q: "How much did NVIDIA invest in private companies and infrastructure funds in fiscal 2026?", file: nvda_10k_2026.pdf, pages: [51], answer: "NVIDIA invested $17.5 billion in private companies and infrastructure funds, mainly early-stage startups, and provided $3.5 billion in land, power and shell guarantees.", facts: ["$17.5 billion", "$3.5 billion"], answerable: true, kind: numeric}
- {id: n31, q: "What did China's antitrust regulators find about NVIDIA's Mellanox acquisition?", file: nvda_10k_2026.pdf, pages: [39], answer: "On September 15, 2025, China's antitrust regulators preliminarily found that NVIDIA's compliance with U.S. export controls, by offering degraded products in China, violated the terms of China's approval of the Mellanox acquisition.", facts: ["September 15, 2025", "Mellanox"], answerable: true, kind: legal}
- {id: n32, q: "Where is a substantial portion of NVIDIA's products warehoused and distributed from?", file: nvda_10k_2026.pdf, pages: [41], answer: "A substantial portion of NVIDIA's products are warehoused in and distributed from Hong Kong, which export controls could disrupt.", facts: ["warehoused in and distributed from Hong Kong"], answerable: true, kind: risk}

