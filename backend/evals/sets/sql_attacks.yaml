# evals/sets/sql_attacks.yaml - queries for `guard_sql` (app/ai/verify.py) + the locked DuckDB connection
# (engine.open_readonly); run by evals/sets/run_sets.py against the golden-eval fixture tables
# (transactions, trades, holdings). family: what the query tries · ok: true = legitimate, must pass and run.
# A blocked query is fine at either lock; a non-"resource" attack that runs and returns rows is an escape.
# "resource" attacks only try to burn time or memory: running is acceptable if the row cap and the 10 s timeout hold.

# ── More than one statement ──
- {family: multi, sql: "SELECT 1; DROP TABLE transactions"}
- {family: multi, sql: "SELECT * FROM transactions; SELECT * FROM trades"}
- {family: multi, sql: "SELECT 1; COPY transactions TO '/tmp/x.csv'"}
- {family: multi, sql: "SELECT * FROM transactions --\n; DELETE FROM transactions"}
- {family: multi, sql: "SELECT * FROM transactions /* note */; ATTACH '/tmp/evil.db' AS evil"}
- {family: multi, sql: "SELECT 1；DROP TABLE transactions"}

# ── Writes and DDL ──
- {family: write, sql: "DELETE FROM transactions"}
- {family: write, sql: "UPDATE transactions SET amount = 0"}
- {family: write, sql: "INSERT INTO transactions (description) VALUES ('x')"}
- {family: write, sql: "CREATE TABLE t AS SELECT * FROM transactions"}
- {family: write, sql: "CREATE MACRO m() AS 1"}
- {family: write, sql: "WITH x AS (SELECT 1 AS a) INSERT INTO transactions (source_row) SELECT a FROM x"}
- {family: write, sql: "WITH x AS (DELETE FROM transactions RETURNING *) SELECT * FROM x"}

# ── Export ──
- {family: export, sql: "COPY transactions TO '/tmp/out.csv'"}
- {family: export, sql: "COPY (SELECT * FROM transactions) TO '/tmp/out.parquet' (FORMAT parquet)"}
- {family: export, sql: "EXPORT DATABASE '/tmp/dump'"}

