# ── Catalog and unknown names ──
- {family: catalog, sql: "SELECT * FROM information_schema.tables"}
- {family: catalog, sql: "SELECT * FROM duckdb_tables()"}
- {family: catalog, sql: "SELECT * FROM users"}
- {family: catalog, sql: "SELECT password FROM transactions"}

# ── Resource burn ──
- {family: resource, sql: "SELECT count(*) FROM transactions a, transactions b, transactions c, transactions d, transactions e"}
- {family: resource, sql: "SELECT * FROM range(1000000000000)"}
- {family: resource, sql: "SELECT a.description FROM transactions a, transactions b, transactions c"}

# ── Legitimate queries a planner writes: must pass and run ──
- {ok: true, sql: "SELECT SUM(amount) AS spent FROM transactions WHERE direction = 'debit' AND date >= DATE '2026-04-01'"}
- {ok: true, sql: "SELECT date_trunc('month', date) AS month, SUM(amount) AS total FROM transactions WHERE direction = 'debit' GROUP BY 1 ORDER BY 1"}
- {ok: true, sql: "SELECT description, amount FROM transactions WHERE date BETWEEN '2026-06-01' AND '2026-06-30' ORDER BY amount DESC LIMIT 1"}
- {ok: true, sql: "SELECT * FROM transactions WHERE description ILIKE '%swiggy%'"}
- {ok: true, sql: "SELECT COUNT(*) AS n FROM transactions WHERE date >= '2026-04-01'"}
- {ok: true, sql: "SELECT symbol, SUM(CASE WHEN side = 'buy' THEN quantity * price ELSE 0 END) AS bought FROM trades GROUP BY symbol"}
- {ok: true, sql: "SELECT strftime(date, '%Y-%m') AS ym, ROUND(SUM(amount), 2) AS total FROM transactions GROUP BY ym"}
- {ok: true, sql: "WITH m AS (SELECT date_trunc('month', date) AS month, SUM(amount) AS t FROM transactions WHERE direction = 'debit' GROUP BY 1) SELECT month, t, t - LAG(t) OVER (ORDER BY month) AS change FROM m"}
- {ok: true, sql: "SELECT h.symbol_or_scheme, h.value, COUNT(t.trade_id) AS trades FROM holdings h LEFT JOIN trades t ON t.symbol = h.symbol_or_scheme GROUP BY 1, 2"}
- {ok: true, sql: "SELECT COUNT(DISTINCT symbol) AS n FROM trades"}
- {ok: true, sql: "SELECT EXTRACT(year FROM date) AS y, SUM(amount) AS total FROM transactions GROUP BY y ORDER BY y"}
- {ok: true, sql: "SELECT description, amount FROM transactions WHERE amount > (SELECT AVG(amount) FROM transactions)"}
- {ok: true, sql: "SELECT COALESCE(SUM(value), 0) - COALESCE(SUM(quantity * avg_cost), 0) AS unrealized FROM holdings"}
- {ok: true, sql: "SELECT side, COUNT(*) AS n, SUM(quantity * price) AS turnover FROM trades WHERE trade_date >= DATE '2026-04-01' GROUP BY side"}
- {ok: true, sql: "SELECT 450000 * 0.12 AS result"}
- {ok: true, sql: "SELECT description, amount FROM transactions WHERE description LIKE '%IGNORE%'"}
