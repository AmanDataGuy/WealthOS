- {family: file, sql: "SELECT * FROM read_csv('/etc/passwd')"}
- {family: file, sql: "SELECT * FROM read_csv_auto('../other_user/datasets/transactions/x.csv')"}
- {family: file, sql: "SELECT * FROM read_parquet('/home/*/storage/users/*/datasets/**/*.parquet')"}
- {family: file, sql: "SELECT * FROM read_text('/etc/hostname')"}
- {family: file, sql: "SELECT * FROM read_blob('/etc/hostname')"}
- {family: file, sql: "SELECT * FROM glob('/*')"}
- {family: file, sql: "SELECT * FROM '/etc/passwd'"}
- {family: file, sql: "SELECT * FROM 'storage/users/other/datasets/transactions/a.parquet'"}
- {family: file, sql: "FROM read_csv('/etc/passwd')"}
- {family: file, sql: "SeLeCt * FrOm ReAd_CsV('/etc/passwd')"}
- {family: file, sql: "SELECT * FROM \"read_csv\"('/etc/passwd')"}
- {family: file, sql: "SELECT * FROM sniff_csv('/etc/passwd')"}
- {family: file, sql: "SELECT * FROM parquet_metadata('/tmp/x.parquet')"}
- {family: file, sql: "SELECT * FROM read_csv('https://example.com/x.csv')"}
- {family: file, sql: "SELECT description FROM transactions UNION ALL SELECT content FROM read_text('/etc/hostname')"}
- {family: file, sql: "SELECT (SELECT content FROM read_text('/etc/hostname')) AS x"}
- {family: file, sql: "WITH f AS (SELECT * FROM read_csv('/etc/passwd')) SELECT * FROM f"}

