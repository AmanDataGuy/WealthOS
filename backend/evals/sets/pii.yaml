# TYPE is the placeholder we expect (EMAIL, UPI, PAN, GSTIN, IFSC, CARD, PHONE, AADHAAR, ACCOUNT, PINCODE, NAME).
# gap: true marks a known weakness kept in the set on purpose so the recall number stays honest.
# Every value is made up (valid formats, Luhn-valid test cards, no real person).

