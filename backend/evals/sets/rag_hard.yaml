# Hard question set for filing Q&A over the same two 10-K filings as rag_golden.yaml (aapl_10k_2025.pdf,
# nvda_10k_2026.pdf). It targets the cases where keyword search should struggle and embeddings should help.
# pages: 1-based PDF pages that answer the question (every such page, and only those). facts: short strings copied
# from the labelled page text, with PDF ligatures expanded (fi, fl, ff) and non-breaking spaces written as plain spaces.
# kind:
#   paraphrase    - natural user wording that avoids the filing's own key terms for the answer passage.
#   conceptual    - the answer is spread across sections or implied; pages lists every page that substantially answers.
#   multi_section - a full answer needs two parts from different Items or Notes. needs is a list of page groups,
#                   one group per required part; a part is satisfied by any page in its group. pages is the union.
#   unanswerable  - a near miss on a topic the filing discusses, but the specific answer is absent from both filings.
#                   answerable false, pages [], answer "not found in the filings".

# ── paraphrase ──
- {id: h01, q: "How big is the pile of money and investments Apple is sitting on?", file: aapl_10k_2025.pdf, pages: [34], answer: "Apple's cash, cash equivalents and marketable securities totaled $132.4 billion as of September 27, 2025.", facts: ["$132.4 billion"], answerable: true, kind: paraphrase}
- {id: h02, q: "If market borrowing costs climbed by one percent, how much extra would Apple owe each year on its bonds?", file: aapl_10k_2025.pdf, pages: [38], answer: "A hypothetical 100 basis point increase across all tenors would raise Apple's annual interest expense on its term debt by $129 million (2025).", facts: ["100 basis points", "Increase in annual interest expense $ 129"], answerable: true, kind: paraphrase}
- {id: h03, q: "How much could Apple's FX book lose in 24 hours in a bad scenario, by its own estimate?", file: aapl_10k_2025.pdf, pages: [38], answer: "Using a Monte Carlo value-at-risk model, Apple estimates with 95% confidence a maximum one-day loss in fair value of $590 million on its foreign currency derivative positions as of September 27, 2025.", facts: ["$590 million", "Monte Carlo simulation"], answerable: true, kind: paraphrase}
- {id: h04, q: "How much does Apple still owe from the one-time US levy on profits it had kept overseas?", file: aapl_10k_2025.pdf, pages: [35], answer: "The balance of the deemed repatriation tax payable under the 2017 Tax Cuts and Jobs Act was $8.8 billion, all payable within 12 months.", facts: ["$8.8 billion", "deemed repatriation tax payable"], answerable: true, kind: paraphrase}
- {id: h05, q: "Why did Apple spend more on inventing new products in 2025?", file: aapl_10k_2025.pdf, pages: [33], answer: "The growth in R&D expense was primarily driven by increases in headcount-related expenses and infrastructure-related costs.", facts: ["headcount-related expenses and infrastructure-related costs"], answerable: true, kind: paraphrase}
- {id: h06, q: "Where in the world did Apple sell less this year than last, and what caused it?", file: aapl_10k_2025.pdf, pages: [30, 71, 73], answer: "Greater China net sales fell to $64,377 million from $66,952 million, primarily due to lower net sales of iPhone, partially offset by higher Mac sales.", facts: ["Greater China net sales decreased", "lower net sales of iPhone", "64,377"], answerable: true, kind: paraphrase}
- {id: h07, q: "How much of the money owed to Apple comes from wireless operators?", file: aapl_10k_2025.pdf, pages: [23, 57], answer: "Third-party cellular network carriers accounted for 34% of total trade receivables as of September 27, 2025 (38% a year earlier).", facts: ["34%", "cellular network carriers"], answerable: true, kind: paraphrase}
- {id: h08, q: "How long do Apple's FX safeguards on its bonds stretch?", file: aapl_10k_2025.pdf, pages: [56], answer: "As of September 27, 2025, the maximum length of time over which Apple hedges variability in future cash flows for term debt-related foreign currency transactions is 17 years.", facts: ["17 years", "term debt–related foreign currency transactions"], answerable: true, kind: paraphrase}
- {id: h09, q: "How big a reserve does NVIDIA hold for fixing broken hardware after it is sold?", file: nvda_10k_2026.pdf, pages: [100, 105], answer: "NVIDIA's product warranty liabilities were $2.8 billion ($2,807 million) as of January 25, 2026, up from $1.3 billion a year earlier.", facts: ["$2.8 billion", "Product warranty 2,807"], answerable: true, kind: paraphrase}
- {id: h10, q: "Who supplies the DRAM that goes into NVIDIA's products?", file: nvda_10k_2026.pdf, pages: [11], answer: "NVIDIA purchases memory from SK Hynix, Micron Technology and Samsung.", facts: ["SK Hynix", "Micron Technology"], answerable: true, kind: paraphrase}
- {id: h11, q: "Which outside firms put together NVIDIA's finished hardware?", file: nvda_10k_2026.pdf, pages: [11], answer: "NVIDIA engages subcontractors and contract manufacturers such as Hon Hai Precision Industry, Wistron and Fabrinet for assembly, testing and packaging of its final products.", facts: ["Hon Hai Precision Industry", "Wistron", "Fabrinet"], answerable: true, kind: paraphrase}
- {id: h12, q: "When do NVIDIA's exclusive rights to its inventions start to lapse, and how long do the last ones run?", file: nvda_10k_2026.pdf, pages: [13], answer: "NVIDIA's currently issued patents have expiration dates from March 2026 to June 2045.", facts: ["March 2026 to June 2045"], answerable: true, kind: paraphrase}
- {id: h13, q: "When in the year do NVIDIA's graphics cards for PC gamers sell best?", file: nvda_10k_2026.pdf, pages: [11], answer: "NVIDIA's desktop gaming products typically see stronger revenue in the second half of its fiscal year, though historical seasonality may not repeat.", facts: ["stronger revenue in the second half of our fiscal year"], answerable: true, kind: paraphrase}
- {id: h14, q: "How much cash did NVIDIA's buyers pay up front before receiving what they ordered this year?", file: nvda_10k_2026.pdf, pages: [100, 101], answer: "Deferred revenue additions in fiscal 2026 included $9.0 billion of customer advances (versus $3.6 billion in fiscal 2025); $160 million of advances remained in the balance at January 25, 2026.", facts: ["$9.0 billion and $3.6 billion of customer advances", "$160 million"], answerable: true, kind: paraphrase}
- {id: h15, q: "How many of NVIDIA's people work on building new technology versus everything else?", file: nvda_10k_2026.pdf, pages: [15], answer: "Of about 42,000 employees, 31,000 were engaged in research and development and 11,000 in sales, marketing, operations and administrative positions.", facts: ["31,000 were engaged in research and development", "11,000"], answerable: true, kind: paraphrase}
- {id: h16, q: "What did Beijing hint was lurking inside NVIDIA's chips?", file: nvda_10k_2026.pdf, pages: [40], answer: "China's government publicly questioned whether NVIDIA's H20 products have built-in vulnerabilities, discouraging customers from buying; NVIDIA responded that its GPUs do not include such vulnerabilities.", facts: ["built-in vulnerabilities"], answerable: true, kind: paraphrase}
