- {id: h32, q: "Apple says some parts come from just one supplier; how much has it already committed to pay its manufacturing partners?", file: aapl_10k_2025.pdf, pages: [6, 11, 12, 34, 70], needs: [[6, 11, 12, 70], [34]], answer: "Certain components come from single or limited sources and new products often use custom components from only one source; Apple had manufacturing purchase obligations of $56.2 billion, with $55.4 billion payable within 12 months.", facts: ["custom components available from only one source", "$56.2 billion", "$55.4 billion"], answerable: true, kind: multi_section}
