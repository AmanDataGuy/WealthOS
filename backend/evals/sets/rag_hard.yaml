# ── conceptual ──
- {id: h18, q: "How exposed is NVIDIA to China?", file: nvda_10k_2026.pdf, pages: [14, 15, 29, 39, 40, 41, 50, 116], answer: "Heavily constrained: U.S. export licensing for H20 led to a $4.5 billion charge, the Chinese government discourages buying NVIDIA data center products, and NVIDIA was effectively foreclosed from China's data center compute market; China (including Hong Kong) revenue fell to $19,677 million from $25,048 million.", facts: ["effectively foreclosed", "19,677", "$4.5 billion charge"], answerable: true, kind: conceptual}
- {id: h19, q: "How dependent is Apple on a few manufacturing partners?", file: aapl_10k_2025.pdf, pages: [10, 12, 23, 57, 70], answer: "Very: outsourcing partners mainly in China mainland, India, Japan, South Korea, Taiwan and Vietnam do most manufacturing, Asian partners do final assembly of substantially all hardware, and two vendors held 46% and 23% of vendor non-trade receivables.", facts: ["final assembly of substantially all", "46% and 23%", "China mainland, India, Japan, South Korea, Taiwan and Vietnam"], answerable: true, kind: conceptual}
- {id: h20, q: "How much does Apple's business hinge on the iPhone?", file: aapl_10k_2025.pdf, pages: [21, 31, 52], answer: "Apple generates a significant portion of net sales from a single product category, so weaker demand for it would hit sales and margins; iPhone net sales were $209,586 million of $416,161 million total in 2025.", facts: ["single product category", "209,586", "416,161"], answerable: true, kind: conceptual}
- {id: h21, q: "Does Apple expect to keep its profit margins where they are?", file: aapl_10k_2025.pdf, pages: [5, 11, 21, 32], answer: "No; Apple believes gross margins will be subject to volatility and downward pressure from aggressive price competition, pricing actions, cost increases, mix shifts, exchange rates and tariffs.", facts: ["volatility and downward pressure", "aggressive price competition"], answerable: true, kind: conceptual}
- {id: h22, q: "How tied is Apple's tax bill to Ireland?", file: aapl_10k_2025.pdf, pages: [23, 34, 58, 60], answer: "Several Apple subsidiaries are organized in Ireland; the EU State Aid Decision confirmed in 2024 produced a $10.2 billion net charge including $15.8 billion payable to Ireland, which also explains the swing in the effective tax rate, and Apple holds $4.7 billion of foreign tax credit carryforwards in Ireland.", facts: ["Ireland and Singapore", "$15.8 billion payable to Ireland", "$4.7 billion in foreign tax credit carryforwards in Ireland"], answerable: true, kind: conceptual}
- {id: h23, q: "How sensitive are Apple's results to currency swings?", file: aapl_10k_2025.pdf, pages: [21, 22, 23, 38, 56], answer: "Quite: Apple is a net receiver of non-dollar currencies, so a stronger U.S. dollar lowers net sales and gross margins; it hedges forecasted exposures with forwards and options typically for up to 12 months, and its value-at-risk model shows a maximum one-day loss of $590 million.", facts: ["strengthening of the U.S. dollar", "typically for up to 12 months", "$590 million"], answerable: true, kind: conceptual}
- {id: h24, q: "What role does Taiwan play in NVIDIA's business?", file: nvda_10k_2026.pdf, pages: [11, 32, 41, 47, 116, 118], answer: "TSMC fabricates NVIDIA wafers and its supply depends especially on Taiwan and South Korea, creating geopolitical risk; NVIDIA has facilities there, Taiwan-headquartered customers brought $42,345 million of revenue, and $3,219 million of long-lived assets sit in Taiwan.", facts: ["Taiwan Semiconductor Manufacturing Company", "especially in Taiwan and South Korea", "42,345"], answerable: true, kind: conceptual}
- {id: h25, q: "Could a shortage of electricity hold back NVIDIA's sales?", file: nvda_10k_2026.pdf, pages: [20, 22, 24, 32, 50], answer: "Yes; NVIDIA says the availability of data centers, energy and capital for its customers' buildout is crucial, expanding energy capacity is a complex multi-year process, and power or water shortages could stop customers expanding data center capacity.", facts: ["Expanding energy capacity", "Power or water shortages", "sufficient data center capacity or energy"], answerable: true, kind: conceptual}
- {id: h26, q: "What are the downsides of NVIDIA launching a new chip generation every year?", file: nvda_10k_2026.pdf, pages: [24, 26, 50], answer: "More frequent, complex transitions magnify supply and demand mismatches and revenue volatility, can make customers delay purchases, and can cause quality or production problems that raise inventory provisions and warranty costs, as with low-yielding Blackwell material.", facts: ["low-yielding Blackwell material", "one-year product cadence", "these transitions are difficult"], answerable: true, kind: conceptual}
