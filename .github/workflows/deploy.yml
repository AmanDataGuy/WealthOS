name: Deploy to EC2

# Deploy is manual-only until Phase 1 replaces it with the CI-gated AWS deploy (PORTFOLIO_PLAN P1.2).
# Reason: the old job reset --hard + rebuilt on EC2 on every push to main with no tests (audit 2026-10-31).
on:
  workflow_dispatch:

jobs:
  deploy:
    if: false   # second lock: remove only in P1.2, together with a `needs: ci` gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/WealthOS
            git fetch origin main
            git reset --hard origin/main
            echo "Deployed commit: $(git log -1 --format='%H %s')"
            docker compose up -d --build --force-recreate
            docker image prune -f
            echo "wealthos-api created at: $(docker inspect $(docker compose ps -q wealthos-api) --format '{{.Created}}')"
