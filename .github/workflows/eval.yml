# .github/workflows/eval.yml
# DeepEval quality gate — runs on every PR touching writer or eval code.
# 5-example smoke test (per PR): fails below an 80% flat floor.
# Full/near-full manual run (workflow_dispatch, limit>=26): fails if it drops
# below the pinned eval/baseline.json count (26/28), not just the 80% floor.
# Reads golden dataset — no live pipeline needed.
name: Eval Gate

on:
  pull_request:
    paths:
      - "agents/writer_agent.py"
      - "eval/writer_golden_dataset.json"
      - "eval/deepeval_metrics.py"
      - "eval/run_deepeval.py"
      - "graph/nodes.py"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of golden-dataset examples to run (28 = full dataset)"
        required: false
        default: "5"

jobs:
  deepeval:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval dependencies
        run: pip install deepeval langchain-groq python-dotenv

      # Per-PR runs are intentionally 5 examples on the Groq judge — this is a
      # fast, free-tier feedback loop for catching regressions, not a quality
      # benchmark. It is NOT the same run as the authoritative one: the "real"
      # number (26/28, 92.9%) documented in eval_report.md was 28 examples on
      # the Gemini judge, run manually. Groq's free-tier 8k TPM cap makes a
      # full 28-example x 9-metric run impractical to run on every PR (it needs
      # 30s inter-metric pacing — see METRIC_SLEEP_SECONDS in run_deepeval.py
      # — which would blow well past a reasonable PR feedback loop); Gemini
      # avoids that but requires a paid, budget-capped key we don't want to
      # spend on every push. Trigger this workflow manually (workflow_dispatch)
      # with a larger `limit` input (up to 28) for a fuller periodic check; the
      # full-28/Gemini run stays a manual, occasional benchmark documented in
      # eval_report.md, not a CI gate.
      - name: Run DeepEval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python eval/run_deepeval.py --limit "${{ github.event.inputs.limit || '5' }}"

      - name: Check pass rate
        run: |
          python - <<'EOF'
          import json, sys, pathlib

          files = sorted(pathlib.Path("eval/results").glob("deepeval_*.json"))
          if not files:
              print("No deepeval results found — skipping gate")
              sys.exit(0)

          data    = json.loads(files[-1].read_text())
          results = data.get("results", [])
          if not results:
              print("No results in file — skipping gate")
              sys.exit(0)

          passed = sum(1 for r in results if r.get("overall_pass"))
          total  = len(results)
          rate   = passed / total
          print(f"DeepEval pass rate: {passed}/{total} ({rate:.0%})")

          baseline_path = pathlib.Path("eval/baseline.json")
          baseline = json.loads(baseline_path.read_text()) if baseline_path.exists() else None

          # A run within 2 examples of the pinned baseline's size is a
          # full/near-full run (28 examples, occasionally 26-27 if a dataset
          # entry gets skipped) — hold it to the exact pinned count, not just
          # the flat floor, so a silent 26/28 -> 24/28 drop still fails even
          # though 24/28 (86%) clears 80%. Anything smaller is the 5-example
          # per-PR smoke test, which has no meaningful equivalent to "26/28"
          # and stays on the flat floor.
          if baseline and abs(total - baseline["total"]) <= 2:
              if passed < baseline["passed"]:
                  print(f"FAIL: {passed}/{total} is below pinned baseline {baseline['passed']}/{baseline['total']} "
                        f"(run_date={baseline['run_date']}, judge={baseline['judge_model']}) — see eval/baseline.json")
                  sys.exit(1)
              print(f"PASS — meets or beats pinned baseline {baseline['passed']}/{baseline['total']}")
              sys.exit(0)

          if rate < 0.80:
              print(f"FAIL: {rate:.0%} < 80% threshold")
              sys.exit(1)
          print("PASS")
          EOF

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-results
          path: eval/results/deepeval_*.json
          retention-days: 30
